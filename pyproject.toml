[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whoqol-toolkit"
version = "0.2.0"
description = "Scoring, psychometrics and publication-grade statistics for WHOQOL questionnaires (WHOQOL-BREF first), as a plugin for Claude Code and Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prof. Dr. Fabiano Bezerra Menegidio", email = "fabianomenegidio@umc.br" }
]
keywords = [
    "whoqol",
    "whoqol-bref",
    "quality-of-life",
    "psychometrics",
    "patient-reported-outcomes",
    "claude-code",
    "antigravity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "semopy>=2.3",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/whoqol-toolkit"
Repository = "https://github.com/LaBiOmicS/whoqol-toolkit.git"
Issues = "https://github.com/LaBiOmicS/whoqol-toolkit/issues"

# Development CLI; the plugin runs skills/whoqol/scripts/whoqol_cli.py with `uv run` (PEP 723).
[project.scripts]
whoqol = "whoqol.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["skills/whoqol/scripts/whoqol"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["skills/whoqol/scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"skills/whoqol/scripts/whoqol/figures.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/whoqol/scripts"]
